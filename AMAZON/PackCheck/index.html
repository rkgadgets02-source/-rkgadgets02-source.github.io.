<style>
:root{--ink:#10222f;--muted:#55687a;--line:#d5dee6;--bg:#f1f5f9;--card:#fff;--brand:#0b4f8a;--brand2:#0a3d6b;
--ok:#0a7a3e;--okbg:#dff5e8;--bad:#c1121f;--badbg:#fde4e6;--warn:#8f4b00;--warnbg:#fff0d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
main{padding:14px 16px;max-width:640px;margin:0 auto}
h2{font-size:20px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:60px;padding:12px 16px;width:100%;
background:var(--brand);color:#fff;cursor:pointer;display:block;text-align:center}
button:active{background:var(--brand2)}
button.alt,.btn.alt{background:#fff;color:var(--brand);border:2px solid var(--brand)}
a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center}
#updateBar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;padding:8px 16px}
#updateBar button{background:var(--ok);box-shadow:0 4px 14px rgba(0,0,0,.25)}
button.alt:active{background:#e6eef5}
button.good{background:var(--ok)}
button.danger{background:#fff;color:var(--bad);border:2px solid var(--bad)}
button.small{min-height:48px;width:auto;padding:8px 14px}
button+button,.gap{margin-top:10px}
input[type=text],input[type=search],input[type=number],select{font:inherit;width:100%;min-height:56px;padding:10px 12px;border:2px solid var(--line);
border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid #9cc4e8;border-color:var(--brand)}
label.f{display:block;font-weight:700;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}

.kv span:last-child{font-weight:700;text-align:right}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.banner{border-radius:14px;padding:14px;margin-bottom:12px;font-weight:600;border:2px solid transparent}
.banner strong{display:block;font-size:22px;line-height:1.25}
.banner.ok{background:var(--ok);color:#fff}
.banner.bad{background:var(--bad);color:#fff}

.pill.packed{background:var(--okbg);color:var(--ok)}
.pill.cancelled{background:var(--badbg);color:var(--bad)}
.pill.open,.pill.hold{background:var(--warnbg);color:var(--warn)}
.line{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}

<body>
<header><h1>PackCheck</h1></header>
<main id="view"></main>
<nav id="tabs" aria-label="Main">
  <a href="#/pack" data-tab="pack"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>Pack</a>
  <a href="#/orders" data-tab="orders"><svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>Orders</a>
  <a href="#/money" data-tab="money"><svg viewBox="0 0 24 24"><path d="M6 4h12M6 9h12M6 4h4a5 5 0 0 1 0 10H6l8 7"/></svg>Revenue</a>

</nav>
<div id="sheet"></div>
<div id="updateBar" class="hide"><button data-act="applyUpdate">New version available — tap to update</button></div>
<input id="fileReport" type="file" class="hide">
<input id="fileBackup" type="file" class="hide">
<input id="filePhoto" type="file" accept="image/*" capture="environment" class="hide">
<script src="vendor/html5-qrcode.min.js"></script>
<script>
'use strict';
/* ---------- Saved data (kept on this phone in IndexedDB) ---------- */
const KEY = 'arcticBazaar.v1'; // where older versions kept data in localStorage
const IDB_NAME = 'packcheck', IDB_STORE = 'kv';
const blank = () => ({ orders: {}, fees: {}, barcodes: {}, moneyBy: 'order', moneyMp: 'all', lastBackup: null });
let db = blank(), idb = null, writing = Promise.resolve(true);

function parseData(text) {
  try {
    const d = JSON.parse(text);
    if (!d || !d.orders) return blank();
    // Orders saved before other marketplaces were added are all Amazon.
    Object.values(d.orders).forEach(o => { o.mp = o.mp || 'amazon'; });
    return { ...blank(), ...d };
  } catch (e) { return blank(); }
}
function openIdb() {
  return new Promise((ok, no) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  });
}
function idbDo(mode, fn) {
  return new Promise((ok, no) => {
    const tx = idb.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => ok(req.result);
    tx.onerror = tx.onabort = () => no(tx.error);
  });
}
function readOldStorage() {
  try { return localStorage.getItem(KEY); } catch (e) { return null; }
}
// Loads saved data. The first time, data from older versions is copied out of
// localStorage, checked, and only then removed from there.
async function startStorage() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try { idb = await openIdb(); } catch (e) { idb = null; }
  if (!idb) { db = parseData(readOldStorage()); return; }
  let text = await idbDo('readonly', s => s.get('data'));
  const old = readOldStorage();
  if (text == null && old) {
    await idbDo('readwrite', s => s.put(old, 'data'));
    if (await idbDo('readonly', s => s.get('data')) === old) {
      try { localStorage.removeItem(KEY); } catch (e) {}
    }
    text = old;
  }
  db = parseData(text);
}
// Saves in the background, one write at a time. The promise says whether it worked.
function save() {
  const text = JSON.stringify(db);
  writing = writing
    .then(() => idb ? idbDo('readwrite', s => s.put(text, 'data')) : localStorage.setItem(KEY, text))
    .then(() => true, () => {
      alert('Your last change was NOT saved because phone storage is full. Open More, download a backup, then free up space.');
      return false;
    });
  return writing;
}

/* ---------- Small helpers ---------- */
const $ = id => document.getElementById(id);
const view = $('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ID_RE = /^\d{3}-\d{7}-\d{7}$/;
const inr = p => '₹' + (p / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'No date';
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const orderHash = id => '#/order/' + encodeURIComponent(id);
const digitsOf = s => String(s).replace(/\D/g, '');
const MP_NAME = { amazon: 'Amazon', flipkart: 'Flipkart', meesho: 'Meesho', shopify: 'Shopify', other: 'Other' };
const mpPill = o => `<span class="pill">${MP_NAME[o.mp] || 'Other'}</span>`;
const marketplaces = () => Object.keys(MP_NAME).filter(mp => allOrders().some(o => o.mp === mp));
// Fees are kept per marketplace. Amazon keeps the plain SKU so older saved fees still apply.
const feeKey = (mp, sku) => mp === 'amazon' ? sku : `${mp}|${sku}`;

function feedback(kind) {
  if (navigator.vibrate) navigator.vibrate(kind === 'bad' ? [250, 100, 250] : 70);
  try {
    const ctx = feedback.ctx || (feedback.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const notes = kind === 'bad' ? [[180, 0, .45]] : kind === 'done' ? [[660, 0, .12], [880, .13, .25]] : [[880, 0, .1]];
    notes.forEach(([freq, at, len]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = kind === 'bad' ? 'square' : 'sine';
      o.frequency.value = freq;
      g.gain.value = .2;
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + at);
      o.stop(ctx.currentTime + at + len);
    });
  } catch (e) {}
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- Order facts ---------- */
function statusKind(mp, status, channel, cancelledAt) {
  const s = (status || '').toLowerCase().replace(/_/g, ' ').trim();
  if (cancelledAt || /cancel/.test(s)) return 'cancelled';
  if (mp === 'amazon' && /^(amazon|afn)$/i.test(channel || '')) return 'fba';
  if (/waiting for pick|ready to (ship|dispatch)/.test(s)) return 'open';
  if (mp === 'amazon' && /^pending/.test(s)) return 'hold';
  if (/^shipped|^dispatched|delivered|return|refund|^rto|pickup complete|in transit|^fulfilled$/.test(s)) return 'shipped';
  return 'open';
}
function stateOf(o) {
  if (o.kind === 'cancelled') return 'cancelled';
  if (o.packedAt) return 'packed';
  return o.kind;
}
const STATE_LABEL = { open: 'To pack', hold: 'Payment pending', packed: 'Packed', cancelled: 'Cancelled', fba: 'Amazon ships', shipped: 'Already shipped' };
const pill = o => `<span class="pill ${stateOf(o)}">${STATE_LABEL[stateOf(o)]}</span>`;
const isPending = o => ['open', 'hold'].includes(stateOf(o));
const allOrders = () => Object.values(db.orders);
const totalQty = o => o.lines.reduce((n, l) => n + l.qty, 0);
const packedQty = o => o.lines.reduce((n, l) => n + l.packed, 0);
const isComplete = o => o.lines.length > 0 && o.lines.every(l => l.packed >= l.qty);
const missingLines = o => o.lines.filter(l => l.packed < l.qty);

function valueOf(o) {
  const v = { items: 0, ship: 0, total: 0, fee: 0, noPrice: false, noFee: [] };
  for (const l of o.lines) {
    if (l.price == null) v.noPrice = true;
    const sale = (l.price || 0) + (l.ship || 0);
    v.items += l.price || 0;
    v.ship += l.ship || 0;
    v.total += sale;
    const pct = db.fees[feeKey(o.mp, l.sku)];
    if (pct == null) v.noFee.push(l.sku);
    else v.fee += sale * pct / 100;
  }
  v.fee = Math.round(v.fee);
  v.net = v.total - v.fee;
  return v;
}
function catalogue() {
  const m = {};
  for (const o of allOrders()) for (const l of o.lines) {
    m[l.sku] = m[l.sku] || { sku: l.sku, name: l.name, asin: l.asin };
  }
  return Object.values(m).sort((a, b) => a.sku.localeCompare(b.sku));
}
function feeCatalogue() {
  const m = {};
  for (const o of allOrders()) for (const l of o.lines) {
    const key = feeKey(o.mp, l.sku);
    m[key] = m[key] || { key, mp: o.mp, sku: l.sku, name: l.name };
  }
  return Object.values(m).sort((a, b) => a.mp.localeCompare(b.mp) || a.sku.localeCompare(b.sku));
}
// Finds orders from a typed number or a scanned code: the full ID, the AWB, or the last 5+ digits.
function lookupOrders(raw) {
  const t = raw.trim().toUpperCase().replace(/^#/, '');
  if (!t) return [];
  const exact = allOrders().filter(o => o.id.toUpperCase().replace(/^#/, '') === t || (o.awb && o.awb.toUpperCase() === t));
  if (exact.length) return exact.map(o => o.id);
  const d = digitsOf(t);
  if (d.length < 4) return [];
  const same = allOrders().filter(o => digitsOf(o.id) === d);
  if (same.length) return same.map(o => o.id);
  return d.length >= 5 ? allOrders().filter(o => digitsOf(o.id).endsWith(d)).map(o => o.id) : [];
}
const cancelledAfterPacking = () => allOrders().filter(o => o.kind === 'cancelled' && o.packedAt && !o.ack);

function cancelAlerts() {
  const list = cancelledAfterPacking();
  if (!list.length) return '';
  return `<div class="banner bad"><strong>Packed, then cancelled</strong>Do not ship these. Pull the parcel out:
    <ul>${list.map(o => `<li class="mono">${esc(o.id)}</li>`).join('')}</ul>
    <button data-act="ackCancelled">I have pulled these out</button></div>`;
}

/* ---------- Reading order reports (Amazon, Flipkart, Meesho, Shopify) ---------- */
function decodeText(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function cleanCell(s) {
  s = s.trim();
  const excel = s.match(/^="(.*)"$/);
  if (excel) return excel[1].trim();
  if (s.length > 1 && s[0] === '"' && s.endsWith('"')) return s.slice(1, -1).replace(/""/g, '"').trim();
  return s;
}
// Amazon's tab files often contain a lone " in product names (5" screen), so tabs are split plainly.
const parseTabbed = text => text.split(/\r\n|\n|\r/).map(l => l.split('\t').map(cleanCell));
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"' && cell.trim() === '') { quoted = true; cell = ''; }
    else if (c === ',') { row.push(cleanCell(cell)); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cleanCell(cell)); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  row.push(cleanCell(cell)); rows.push(row);
  return rows;
}
let xlsxLib = null;
function loadXlsx() {
  return xlsxLib || (xlsxLib = new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'vendor/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = () => { xlsxLib = null; no(new Error('The Excel reader could not load. Connect to the internet once and try again.')); };
    document.head.append(s);
  }));
}
// Every sheet becomes rows of text. Dates become ISO text in phone time.
function sheetRows(ws) {
  if (!ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']), rows = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    const row = [];
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      let v = '';
      if (cell && cell.v != null) {
        if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
          const d = XLSX.SSF.parse_date_code(cell.v);
          v = new Date(d.y, d.m - 1, d.d, d.H, d.M, Math.floor(d.S)).toISOString();
        } else if (cell.t === 'n') v = cell.w && !/e\+/i.test(cell.w) ? cell.w : String(cell.v);
        else v = String(cell.v);
      }
      row.push(v.trim());
    }
    rows.push(row);
  }
  return rows;
}
async function readReportFile(file) {
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf.slice(0, 8));
  const isZip = b[0] === 0x50 && b[1] === 0x4B, isOldExcel = b[0] === 0xD0 && b[1] === 0xCF;
  const text = isZip || isOldExcel ? '' : decodeText(buf).replace(/^﻿/, '');
  if (isZip || isOldExcel || /^\s*<(table|html|\?xml)/i.test(text)) {
    await loadXlsx();
    const wb = XLSX.read(buf, { type: 'array' });
    return wb.SheetNames.map(n => sheetRows(wb.Sheets[n]));
  }
  return [parseTabbed(text), parseCsv(text)];
}

// Column names are compared in lowercase with only letters and digits.
// A trailing * means the price is for one unit; a trailing + means it already includes shipping;
// a leading ^ matches any column that starts with the name.
const FORMATS = [
  {
    mp: 'shopify', detect: n => n.includes('lineitemname') || n.includes('lineitemsku'),
    validId: id => /^#?[A-Za-z0-9][\w-]*$/.test(id),
    cols: {
      id: ['name'], sku: ['lineitemsku'], name: ['lineitemname'], qty: ['lineitemquantity'], price: ['lineitemprice*'],
      ship: ['shipping'], date: ['createdat'], status: ['fulfillmentstatus'], cancel: ['cancelledat']
    }
  },
  {
    mp: 'meesho', detect: n => n.includes('suborderno') || n.includes('subordernumber'),
    validId: id => /^\d{6,}(_\d+)?$/.test(id),
    cols: {
      id: ['suborderno', 'subordernumber'], sku: ['sku'], name: ['productname'], variant: ['size', 'variation'], qty: ['quantity'],
      price: ['^supplierdiscountedprice*', '^supplierlistedprice*', 'price*'], date: ['orderdate'],
      status: ['reasonforcreditentry', 'orderstatus', 'status'], awb: ['awb', 'awbnumber', 'awbno', 'trackingid']
    }
  },
  {
    mp: 'flipkart', detect: n => n.includes('orderitemid') || n.includes('fsn'),
    validId: id => /^OD\d{6,}$/i.test(id),
    cols: {
      id: ['orderid'], sku: ['sku', 'sellersku'], name: ['product', 'producttitle', 'productname'], asin: ['fsn'], qty: ['quantity', 'qty'],
      price: ['sellingpriceperitem*', '^priceincfkmpcontribution', 'invoiceamount+', 'sellingprice'],
      ship: ['shippingcharge', 'shippingcharges'], date: ['orderdate', 'orderedon'], status: ['orderstate', 'orderstatus'],

      // The library reads barcodes at the size of its element, and thin AWB bars vanish
      // at phone-screen width. So it gets a large element, shrunk to fit only on screen.
      box.innerHTML = `<div id="camInner" style="width:${SCAN_WIDTH}px"></div>`;
      const inner = $('camInner'), zoom = box.clientWidth / SCAN_WIDTH;
      inner.style.transform = `scale(${zoom})`;
      const F = Html5QrcodeSupportedFormats;
      const inst = new Html5Qrcode('camInner', {
        verbose: false,
        useBarCodeDetectorIfSupported: true,
        formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.QR_CODE, F.DATA_MATRIX]

  onRead(text, onCode) {

      return `<div class="banner bad"><strong>CANCELLED: DO NOT SHIP</strong>This order was cancelled.${o.packedAt ? ' Pull the parcel out.' : ''}</div>`;
    case 'packed':
      if (!job.fromScan && job.msg) return '';
      return job.fromScan
        ? `<div class="banner bad"><strong>ALREADY PACKED</strong>This order was packed on ${esc(fmtDateTime(o.packedAt))}. Do not ship it twice.</div>`
        : `<div class="banner ok"><strong>Fully packed</strong>${esc(fmtDateTime(o.packedAt))}</div>`;
    case 'fba':
      return `<div class="banner warn"><strong>Amazon ships this order</strong>The report says Amazon fulfils it, so you may not need to pack it.</div>`;
    case 'shipped':
      return `<div class="banner warn"><strong>Already shipped</strong>${MP_NAME[o.mp] || 'The marketplace'} shows this order as ${esc(o.status || 'shipped')}.</div>`;
    case 'hold':
      return `<div class="banner warn"><strong>Payment pending</strong>Amazon still shows Pending. Wait before shipping.</div>`;
  }
  return '';
}
function paintOrder() {
  const o = db.orders[job.id];

  $('orderTop').innerHTML = `${banner(job.note)}${banner(job.msg)}${statusBanner(o)}
    <div class="card">
      <div class="row"><div class="grow mono"><b>${esc(o.id)}</b></div>${pill(o)}</div>
      <div class="kv"><span>Marketplace</span><span>${MP_NAME[o.mp] || 'Other'}</span></div>
      <div class="kv"><span>Order value</span><span>${v.noPrice ? 'Price not in report' : inr(v.total)}</span></div>
      <div class="kv"><span>Ordered</span><span>${esc(fmtDate(o.date))}</span></div>

  const packable = canPack(o);

  $('orderBody').innerHTML = `
    ${packable ? `<h2>Packed ${packedQty(o)} of ${totalQty(o)} items</h2>` : '<h2>Items</h2>'}

    ${o.lines.map((l, i) => `<div class="line ${l.packed >= l.qty ? 'done' : ''}">
      <div class="row"><div class="grow"><div class="name">${esc(l.name)}</div><div class="muted mono">${esc(l.sku)}</div></div>

        ${l.packed > 0 ? `<button class="danger minus" data-act="minus" data-i="${i}" aria-label="Remove one">−1</button>` : ''}

      </div>` : ''}
    </div>`).join('')}
    ${packable ? `<button data-act="checkOrder">Check and finish</button>` : ''}
    ${o.packedAt ? `<button data-act="nextLabel">Scan next label</button>
      <button class="danger" data-act="undoPacked">Undo packed</button>` : ''}`;
}
function startProductCam() {
  const box = $('camBox');
  box.classList.remove('hide');
  job.camStarting = true;
  paintOrder();
  Cam.start('camBox', onProductCode, msg => {
    job.camStarting = false;
    box.classList.add('hide');
    job.msg = { kind: 'bad', title: 'Camera problem', text: msg + ' You can still tick items by hand.' };
    paintOrder();
  }).then(() => { job.camStarting = false; });
}
function stopProductCam() {
  job.camStarting = false;

  if (box) done.then(() => box.classList.add('hide'));

}
actions.scanProducts = () => { job.msg = null; startProductCam(); };

actions.nextLabel = () => {

};

function tick(o, line, n) {
  line.packed = Math.max(0, Math.min(line.qty, line.packed + n));
  if (isComplete(o)) {
    o.packedAt = new Date().toISOString();
    job.fromScan = false;
    job.note = null;
    job.msg = { kind: 'ok', title: 'Fully packed', text: `All ${totalQty(o)} items are in. Seal the box.` };
    feedback('done');
    stopProductCam();
  } else if (n > 0) {
    job.msg = { kind: 'info', title: `OK: ${line.packed} of ${line.qty}`, text: line.name };
    feedback('ok');
  } else job.msg = null;
  save();
  paintOrder();
}
function skuForCode(code, o) {
  if (db.barcodes[code]) return db.barcodes[code];
  const same = l => l.sku.toLowerCase() === code.toLowerCase() || (l.asin && l.asin.toLowerCase() === code.toLowerCase());
  const here = o.lines.find(same);
  if (here) return here.sku;
  const other = catalogue().find(same);
  return other ? other.sku : null;
}
function wrongItem(o, sku) {
  const item = catalogue().find(c => c.sku === sku);
  job.msg = { kind: 'bad', title: 'WRONG ITEM', text: `${item ? item.name : sku} is not in this order. Take it out.` };
  feedback('bad');
  paintOrder();
}
function onProductCode(code) {
  const o = db.orders[job.id];
  if (job.sheet || !o || !canPack(o)) return;
  const sku = skuForCode(code, o);
  if (!sku) return askBarcode(code, o);
  const line = o.lines.find(l => l.sku === sku);
  if (!line) return wrongItem(o, sku);
  if (line.packed >= line.qty) {
    job.msg = { kind: 'bad', title: 'EXTRA ITEM', text: `This order only needs ${line.qty} of ${line.name}. Take the extra one out.` };
    feedback('bad');
    return paintOrder();
  }
  tick(o, line, 1);
}
function askBarcode(code, o) {
  job.sheet = code;
  feedback('ok');
  const others = catalogue().filter(c => !o.lines.some(l => l.sku === c.sku));
  $('sheet').innerHTML = `<div class="sheet"><div>
    <h3>New barcode</h3>
    <p class="muted">Look at the product in your hand. The app will remember this barcode <span class="mono">${esc(code)}</span>.</p>
    ${o.lines.map(l => `<button class="alt gap" data-act="linkHere" data-sku="${esc(l.sku)}">${esc(l.name.slice(0, 70))}<br><span class="muted mono">${esc(l.sku)}</span></button>`).join('')}
    ${others.length ? `<label class="f gap" for="linkOther">It is a different product</label>
      <select id="linkOther"><option value="">Choose SKU…</option>${others.map(c => `<option value="${esc(c.sku)}">${esc(c.sku)} – ${esc(c.name.slice(0, 40))}</option>`).join('')}</select>` : ''}
    <button class="danger gap" data-act="notInOrder">Not in this order</button>
    <button class="alt" data-act="closeSheet">Scanned by mistake</button>
  </div></div>`;
  const other = $('linkOther');
  if (other) other.addEventListener('change', () => { if (other.value) confirmBarcode(other.value); });
}
// A wrong link would make the app accept the wrong product later, so it is confirmed first.
function confirmBarcode(sku) {

  $('sheet').innerHTML = `<div class="sheet"><div>
    <h3>Save this barcode?</h3>

}
function closeSheet() {
  job.sheet = false;
  $('sheet').innerHTML = '';
}
actions.closeSheet = closeSheet;
actions.linkHere = el => confirmBarcode(el.dataset.sku);
actions.chooseAgain = () => askBarcode(job.sheet, db.orders[job.id]);
actions.saveBarcode = el => {
  const o = db.orders[job.id], sku = el.dataset.sku;

  if (line.packed >= line.qty) {

actions.notInOrder = () => {

  job.msg = { kind: 'bad', title: 'WRONG ITEM', text: 'This product is not in the order. Take it out.' };

};
actions.plus = el => { const o = db.orders[job.id]; tick(o, o.lines[+el.dataset.i], 1); };
actions.minus = el => { const o = db.orders[job.id]; tick(o, o.lines[+el.dataset.i], -1); };
actions.checkOrder = () => {
  const o = db.orders[job.id];
  const miss = missingLines(o);
  if (miss.length) {
    job.msg = {
      kind: 'bad', title: `MISSING ${miss.reduce((n, l) => n + l.qty - l.packed, 0)} ITEM(S)`,
      text: miss.map(l => `${l.qty - l.packed} × ${l.name}`).join('; ')

/* ---------- Revenue tab ---------- */
function totals(test) {
  const t = { count: 0, total: 0, fee: 0, net: 0, byMp: {} };
  for (const o of allOrders()) {
    if (o.kind === 'cancelled' || (db.moneyMp !== 'all' && o.mp !== db.moneyMp)) continue;
    const when = db.moneyBy === 'packed' ? o.packedAt : o.date;
    if (!when || !test(new Date(when))) continue;
    const v = valueOf(o);
    t.count++; t.total += v.total; t.fee += v.fee; t.net += v.net;
    t.byMp[o.mp] = (t.byMp[o.mp] || 0) + v.total;
  }
  return t;
}
function moneyCard(title, t) {

}

function csvCell(v) {
  let s = String(v == null ? '' : v);

    <p class="muted">PackCheck. No accounts, no ads, nothing uploaded.</p>
    <a class="btn alt" href="privacy.html">Privacy policy</a>
    <h2>Danger zone</h2>
    <button class="danger" data-act="wipe">Delete all data</button>`;
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(yes => {
    const el = $('persistState');
    if (el) el.textContent = yes ? 'Protected from automatic clearing.' : 'The phone may clear it if storage runs low.';
  }).catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(() => {
    const el = $('offlineState');
    if (el) el.textContent = 'Ready to work offline.';
  });
}
// Shown on the Pack tab when there are orders and no backup in the last day.
function backupReminder() {
  if (!Object.keys(db.orders).length) return '';
  const age = db.lastBackup ? Date.now() - new Date(db.lastBackup).getTime() : Infinity;
  if (age < 864e5) return '';
  const days = Math.floor(age / 864e5);
  return `<div class="banner warn"><strong>Back up your data</strong>${db.lastBackup ? `Last backup was ${days} day${days === 1 ? '' : 's'} ago.` : 'You have never downloaded a backup.'} Your orders exist only on this phone.
    <button data-act="backup">Download backup</button></div>`;
}
actions.unlink = el => {
  if (!confirm('Remove this barcode? The app will ask about it next time.')) return;
  delete db.barcodes[el.dataset.code];
  save();
  renderMore();
};
actions.backup = () => {
  db.lastBackup = new Date().toISOString();
  download(`packcheck-backup-${dayKey(new Date())}.json`, JSON.stringify(db), 'application/json');
  save();
  route();
};
actions.restore = () => { $('fileBackup').value = ''; $('fileBackup').click(); };
$('fileBackup').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  let d;
  try {
    d = JSON.parse(await file.text());
    if (!d || typeof d.orders !== 'object' || Array.isArray(d.orders)) throw new Error('shape');
  } catch (err) {
    alert('That file is not a PackCheck backup.');
    return;
  }
  if (!confirm(`Replace everything on this phone with this backup (${Object.keys(d.orders).length} orders)?`)) return;
  const old = db;
  db = parseData(JSON.stringify(d));
  if (await save()) alert('Backup restored.');
  else db = old;
  route();
});
actions.wipe = () => {
  if (!confirm('Delete ALL orders, history, fees and barcodes from this phone?')) return;
  if (!confirm('This cannot be undone. Delete everything?')) return;
  db = blank();
  save();
  route();
};

/* ---------- App updates ---------- */
// A new version is installed in the background. The bar lets the user switch to it now.
let updating = false;
function showUpdateBar() { $('updateBar').classList.remove('hide'); }
actions.applyUpdate = async () => {
  await writing;
  const reg = await navigator.serviceWorker.getRegistration();
  if (reg && reg.waiting) {
    updating = true;
    reg.waiting.postMessage('skipWaiting');
  } else location.reload();
};
if ('serviceWorker' in navigator) {
  // A new version takes over in the background. The page on screen is still the old one, so offer a reload.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updating) location.reload();
    else if (hadController) showUpdateBar();
  });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'page-updated') showUpdateBar(); });
  navigator.serviceWorker.startMessages();
}
function watchForUpdates() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => { if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(); };
    check();
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (sw) sw.addEventListener('statechange', () => { if (sw.state === 'installed') check(); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

startStorage().catch(() => { db = parseData(readOldStorage()); }).then(() => {
  window.addEventListener('hashchange', route);
  route();
  watchForUpdates();
});
</script>
